definitions = '''
  struct __attribute__((__packed__)) Foo {
    char *p; /* 8 bytes */
    char c;  /* 1 byte  */
    long x;  /* 8 bytes */
  };
'''
[cases]
  [cases.a]
    param_types = ["const Foo&"]
    setup = "return {};"
    expect_json = '''[{
      "staticSize":17,
      "dynamicSize":0,
      "exclusiveSize":0,
      "size":17,
      "members":[
        {"name":"p", "offset":0, "staticSize":8, "dynamicSize":0, "exclusiveSize":8, "size":8},
        {"name":"c", "offset":8, "staticSize":1, "dynamicSize":0, "exclusiveSize":1, "size":1},
        {"name":"x", "offset":9, "staticSize":8, "dynamicSize":0, "exclusiveSize":8, "size":8}
      ]}]'''
