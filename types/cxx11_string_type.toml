func = """
template<typename T, typename Traits, typename Allocator>
void getSizeType(const %1%<T, Traits, Allocator> &container, size_t& returnArg)
{
    SAVE_SIZE(sizeof(%1%<T>));

    SAVE_DATA((uintptr_t)container.capacity());
    SAVE_DATA((uintptr_t)container.size());

    // Test for small string optimisation - whether the underlying string is
    // contained within the string object.
    SAVE_SIZE(
      isStorageInline(container) ? 0 : (container.capacity() * sizeof(T))
    );
}
"""

extra = """
template <typename Ctx, typename CharT, typename Traits, typename Allocator>
class CaptureKeyHandler<Ctx, std::__cxx11::basic_string<CharT, Traits, Allocator>> {
  using DB = typename Ctx::DataBuffer;
 public:
  // List of characters
  using type = types::st::List<DB, types::st::VarInt<DB>>;

  static auto captureKey(const std::__cxx11::basic_string<CharT, Traits, Allocator>& key, auto returnArg) {
    auto tail = returnArg.write(key.size());
    for (auto c : key) {
      tail = returnArg.write((uintptr_t)c);
    }
    return tail.finish();
  }
};
"""

traversal_func = """
    const bool sso = isStorageInline(container);

    const uintptr_t objectBase = reinterpret_cast<uintptr_t>(&container);
    const uintptr_t dataBase =
        sso ? 0 : reinterpret_cast<uintptr_t>(container.data());

    const uint64_t objectIntervalSize =
        static_cast<uint64_t>(sizeof(container));

    const uint64_t dataIntervalSize =
        sso ? 0 : static_cast<uint64_t>((container.capacity() + 1) * sizeof(T0));

    auto tail = returnArg.write(container.capacity())
        .write(sso)
        .write(container.size())
        .write(objectBase)
        .write(objectIntervalSize)
        .write(dataBase)
        .write(dataIntervalSize);

    return maybeCaptureBytes<oi_capture_bytes>(
        tail,
        std::span<const uint8_t>(
            reinterpret_cast<const uint8_t*>(container.data()),
            container.size() * sizeof(T0)));
"""

# Research groundwork for byte-accurate object capture/reconstruction (see
# docs/object-capture-initial-thoughts.md, not part of this repo) - see
# ContainerInfo.h's `reconstruct`/`reconstruct_kind` field docs for the
# calling convention. A string's whole reconstructable content is the one
# contiguous captured byte blob above (the "bytes" convention), not a
# per-element list - constructing directly from (pointer, count) handles
# embedded nulls correctly, unlike relying on null termination.
reconstruct_kind = "bytes"
reconstruct = """
return %1%<T0>(reinterpret_cast<const T0*>(contentBytes.data()),
              contentBytes.size() / sizeof(T0));
"""

