[info]
type_name = "std::pair"
ctype = "PAIR_TYPE"
header = "utility"

# Old:
typeName = "std::pair<"
ns = ["namespace std"]
numTemplateParams = 2
replaceTemplateParamIndex = []

[codegen]
decl = """
template<typename P, typename Q>
void getSizeType(const %1%<P,Q> &container, size_t& returnArg);
"""

func = """
template<typename P, typename Q>
void getSizeType(const %1%<P,Q> &container, size_t& returnArg)
{
    SAVE_SIZE(sizeof(%1%<P,Q>) - sizeof(P) - sizeof(Q));

    getSizeType(container.first, returnArg);
    getSizeType(container.second, returnArg);
}
"""

traversal_func = """
    return OIInternal::getSizeType<Ctx>(ctx, 
        container.second,
        returnArg.delegate([&ctx, &container](auto ret) {
            return OIInternal::getSizeType<Ctx>(ctx, container.first, ret);
        })
    );
"""

# Research groundwork for byte-accurate object capture/reconstruction (see
# docs/object-capture-initial-thoughts.md, not part of this repo) - see
# ContainerInfo.h's `reconstruct`/`reconstruct_kind` field docs for the
# "pair" calling convention (a new, small kind: same T0/T1 shape as "map",
# but a fixed two-element pair rather than a variable-length list of them -
# std::pair's own content processor below is a bare Pair<T0,T1>, no length
# prefix at all).
reconstruct_kind = "pair"
reconstruct = """
return %1%<T0, T1>(std::move(first), std::move(second));
"""

[[codegen.processor]]
type = "types::st::Pair<DB, typename TypeHandler<Ctx, T0>::type, typename TypeHandler<Ctx, T1>::type>"
func = """
static constexpr auto firstField = make_field<Ctx, T0>("first");
static constexpr auto secondField = make_field<Ctx, T1>("second");

el.exclusive_size = sizeof(std::pair<T0, T1>) - sizeof(T0) - sizeof(T1);
stack_ins(secondField);
stack_ins(firstField);
"""
