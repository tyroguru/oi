[info]
type_name = "std::reference_wrapper"
ctype = "REF_WRAPPER_TYPE"
header = "functional"

# Old:
typeName = "std::reference_wrapper<"
ns = ["namespace std"]
numTemplateParams = 1
replaceTemplateParamIndex = []

[codegen]
decl = """
template<typename T>
void getSizeType(const %1%<T> &ref, size_t& returnArg);
"""

func = """
template<typename T>
void getSizeType(const %1%<T> &ref, size_t& returnArg)
{
    SAVE_SIZE(sizeof(%1%<T>));
    SAVE_DATA((uintptr_t)&(ref.get()));
    if (ctx.pointers.add((uintptr_t)&ref.get())) {
        SAVE_DATA(1);
        getSizeType(ref.get(), returnArg);
    } else {
        SAVE_DATA(0);
    }
}
"""

traversal_func = """
auto tail = returnArg.write((uintptr_t)&(container.get()));

if (ctx.pointers.add((uintptr_t)&container.get())) {
  return tail.template delegate<1>([&ctx, &container](auto ret) {
    return OIInternal::getSizeType<Ctx>(ctx, container.get(), ret);
  });
} else {
  return tail.template delegate<0>(std::identity());
}
"""

# Research groundwork for byte-accurate object capture/reconstruction (see
# docs/object-capture-initial-thoughts.md, not part of this repo) - see
# ContainerInfo.h's `reconstruct`/`reconstruct_kind` field docs for the
# "pointer" calling convention, already proven on std::unique_ptr. Same
# wire shape (address + present/absent), and the same "no aliasing/cycle
# support yet" limitation as std::unique_ptr - but for a different reason:
# std::unique_ptr's captured address can never *legitimately* reappear
# (sole ownership), so a repeat there always means a genuine reference
# cycle. std::reference_wrapper carries no ownership at all, so two
# separate reference_wrappers (or a reference_wrapper and a raw pointer)
# legitimately aliasing the same object is completely valid C++ and not a
# cycle - OIL just doesn't support reconstructing that aliasing yet either
# (see emitReconstructValue's own comment on the shared error message this
# hits, which names both possibilities rather than guessing). Unlike
# unique_ptr, `present` is never legitimately false here (a C++ reference
# is never null), so the only way to reach the `else` below at all is that
# unsupported-aliasing case - defensively guarded rather than assumed
# unreachable, since asserting it would be far less clear than saying so
# directly. new T0(...) deliberately never freed - see
# emitReconstructPointerValue's own doc for why that's a documented choice,
# not an oversight, for a container with no destruction machinery of its
# own to hook into.
reconstruct_kind = "pointer"
reconstruct = """
if (present) {
  return %1%<T0>(*(new T0(pointeeVal())));
}
throw std::runtime_error(
    "oi::reconstruct: std::reference_wrapper - captured with a null/zero "
    "address, which should never happen for a genuine C++ reference - not "
    "yet supported");
"""

[[codegen.processor]]
type = "types::st::VarInt<DB>"
func = """
el.pointer = std::get<ParsedData::VarInt>(d.val).value;
"""

[[codegen.processor]]
type = """
types::st::Sum<DB,
  types::st::Unit<DB>,
  typename TypeHandler<Ctx, T0>::type>
"""
func = """
auto sum = std::get<ParsedData::Sum>(d.val);
el.container_stats.emplace(result::Element::ContainerStats {
  .capacity = 1,
  .length = sum.index, // 0 if in a cycle, 1 otherwise
});

if constexpr (oi_is_complete<T0>) {
  if (sum.index == 1) {
    static constexpr auto element = make_field<Ctx, T0>("ref_val");
    stack_ins(element);
  }
}
"""
