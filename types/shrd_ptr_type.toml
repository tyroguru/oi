[info]
type_name = "std::shared_ptr"
ctype = "SHRD_PTR_TYPE"
header = "memory"

# Old:
typeName = "std::shared_ptr"
ns = ["namespace std"]
numTemplateParams = 1
replaceTemplateParamIndex = []

[codegen]
decl = """
template<typename T>
void getSizeType(const %1%<T> &s_ptr, size_t& returnArg);
"""

func = """
template<typename T>
void getSizeType(const %1%<T> &s_ptr, size_t& returnArg)
{
    SAVE_SIZE(sizeof(%1%<T>));

    if constexpr (oi_is_complete<T>) {
        SAVE_DATA((uintptr_t)(s_ptr.get()));

        if (s_ptr && ctx.pointers.add((uintptr_t)(s_ptr.get()))) {
            SAVE_DATA(1);
            getSizeType(*(s_ptr.get()), returnArg);
        } else {
            SAVE_DATA(0);
        }
    }
}
"""

traversal_func = """
auto tail = returnArg.write((uintptr_t)container.get());

if constexpr (!oi_is_complete<T0>) {
  return tail.template delegate<0>(std::identity());
} else {
  bool do_visit = container && ctx.pointers.add((uintptr_t)container.get());
  if (!do_visit)
    return tail.template delegate<0>(std::identity());

  return tail.template delegate<1>([&ctx, &container](auto ret) {
    return OIInternal::getSizeType<Ctx>(ctx, *container, ret);
  });
}
"""

# Research groundwork for byte-accurate object capture/reconstruction (see
# docs/object-capture-initial-thoughts.md, not part of this repo) - see
# ContainerInfo.h's `reconstruct`/`reconstruct_kind`/
# `reconstruct_uses_alias_registry` field docs for the calling convention.
# Unlike std::unique_ptr, std::shared_ptr genuinely allows aliasing
# (multiple shared_ptrs to the same object) - registerAlias/lookupAlias
# (in scope because reconstruct_uses_alias_registry is set below) resolve
# a repeated address to the same already-reconstructed instance. A
# lookupAlias() miss still means a cycle (the address was seen, but
# nothing finished constructing it yet) - not yet supported, so that
# still throws.
reconstruct_kind = "pointer"
reconstruct_uses_alias_registry = true
reconstruct = """
if (present) {
  return registerAlias(std::make_shared<T0>(pointeeVal()));
}
if (address == 0) {
  return %1%<T0>{};
}
if (auto aliased = lookupAlias()) {
  return *aliased;
}
throw std::runtime_error(
    "oi::reconstruct: %1% - cycle detected (a captured pointer address "
    "was reused but nothing has finished reconstructing it yet) - not "
    "yet supported");
"""

[[codegen.processor]]
type = "types::st::VarInt<DB>"
func = """
el.pointer = std::get<ParsedData::VarInt>(d.val).value;
"""

[[codegen.processor]]
type = """
types::st::Sum<DB,
  types::st::Unit<DB>,
  typename TypeHandler<Ctx, std::decay_t<T0>>::type>
"""
func = """
#ifdef __GLIBCXX__
// TODO: Accurately report the control block overhead
//       accounting for both in-place and non-in-place

// _Sp_counted_base (_Atomic_word, _Atomic_word)
// _Sp_counted_ptr : _Sp_counted_base (_Ptr)
// _Sp_counted_ptr_inplace : _Sp_counted_base (_Tp)
// _Sp_counted_deleter : _Sp_counted_base (_Ptr)
// _Sp_counted_array : _Sp_counted_base (_Ptr)
#elif _LIBCPP_VERSION
static_assert(false && "libc++ is currently not supported");
#else
static_assert(false && "No known element_size for sets. See types/set_type.toml");
#endif

auto sum = std::get<ParsedData::Sum>(d.val);
el.container_stats.emplace(result::Element::ContainerStats {
  .capacity = 1,
  .length = sum.index, // 0 for empty containers/void, 1 otherwise
});

// Must be in a `if constexpr` or the compiler will complain about make_field<Ctx, void>
if constexpr (oi_is_complete<T0>) {
  if (sum.index == 1) {
    static constexpr auto element = make_field<Ctx, T0>("ptr_val");
    stack_ins(element);
  }
}
"""
